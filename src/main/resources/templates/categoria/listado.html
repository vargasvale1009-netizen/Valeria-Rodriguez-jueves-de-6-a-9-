<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"/>

    <body>
        <header th:replace="~{general/fragmentos :: header}"/>

        <div class="contenedor-listado">
            <div class="row">

                <!-- Tabla de categorías -->
                <div class="col-md-9">
                    <div class="card border">
                        <div class="card-body p-0">
                            <h5 class="px-3 pt-3 pb-2 mb-0 border-bottom fw-normal">
                                [[#{categoria.listado.titulo}]]
                            </h5>
                            <table class="table table-hover mb-0 tabla-categorias">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>[[#{categoria.col.descripcion}]]</th>
                                        <th>[[#{categoria.col.imagen}]]</th>
                                        <th>[[#{categoria.col.activo}]]</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="cat : ${categorias}">
                                        <td th:text="${cat.id}" class="align-middle"></td>
                                        <td th:text="${cat.descripcion}" class="align-middle"></td>
                                        <td class="align-middle">
                                            <img th:src="${cat.imagen}"
                                                 th:alt="${cat.descripcion}"
                                                 class="img-categoria"
                                                 onerror="this.alt='Imagen de categoría'; this.src=''; this.className='text-muted fst-italic img-error'"/>
                                        </td>
                                        <td class="align-middle">
                                            <span th:if="${cat.activo}"  class="text-dark">[[#{categoria.estado.activa}]]</span>
                                            <span th:unless="${cat.activo}" class="text-dark">[[#{categoria.estado.inactiva}]]</span>
                                        </td>
                                        <td class="align-middle text-nowrap">
                                            <a th:href="@{/categoria/eliminar/{id}(id=${cat.id})}"
                                               class="btn btn-danger btn-sm me-1"
                                               onclick="return confirm('¿Desea eliminar esta categoría?')">
                                                <i class="fas fa-trash"></i> [[#{categoria.btn.eliminar}]]
                                            </a>
                                            <!-- Botón Actualizar: abre el modal con los datos de la categoría -->
                                            <button type="button"
                                                    class="btn btn-warning btn-sm"
                                                    data-bs-toggle="modal"
                                                    data-bs-target="#modalActualizar"
                                                    th:data-id="${cat.id}"
                                                    th:data-descripcion="${cat.descripcion}"
                                                    th:data-activo="${cat.activo}"
                                                    th:data-imagen="${cat.imagen}"
                                                    onclick="abrirModalActualizar(this)">
                                                <i class="fas fa-pencil-alt"></i> [[#{categoria.btn.actualizar}]]
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Panel Total Categorías -->
                <div class="col-md-3">
                    <div class="card card-total-categorias text-white text-center">
                        <div class="card-body py-4">
                            <h5 class="card-title fw-bold">[[#{categoria.total.titulo}]]</h5>
                            <div class="mt-2">
                                <i class="fas fa-layer-group fa-2x"></i>
                                <h2 class="fw-bold mt-1" th:text="${totalCategorias}">0</h2>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- ===== MODAL ACTUALIZAR CATEGORÍA ===== -->
        <div class="modal fade" id="modalActualizar" tabindex="-1" aria-labelledby="modalActualizarLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">

                    <!-- Header amarillo -->
                    <div class="modal-header modal-header-actualizar">
                        <h5 class="modal-title" id="modalActualizarLabel">[[#{categoria.modal.titulo}]]</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <!-- Body del formulario -->
                    <form id="formActualizar" th:action="@{/categoria/actualizar}" method="post" enctype="multipart/form-data">
                        <input type="hidden" id="modalCatId" name="id"/>

                        <div class="modal-body">

                            <!-- Descripción -->
                            <div class="mb-3">
                                <label for="modalDescripcion" class="form-label">[[#{categoria.col.descripcion}]]</label>
                                <input type="text" class="form-control" id="modalDescripcion" name="descripcion" required/>
                            </div>

                            <!-- Activo -->
                            <div class="mb-3">
                                <label class="form-label d-block">[[#{categoria.col.activo}]]</label>
                                <input type="checkbox" id="modalActivo" name="activo" value="true" class="form-check-input"/>
                            </div>

                            <!-- Imagen (file input) -->
                            <div class="mb-3">
                                <label for="modalImagen" class="form-label">[[#{categoria.col.imagen}]]</label>
                                <input type="file" class="form-control" id="modalImagen" name="imagenFile"
                                       accept="image/*" onchange="previsualizarImagen(this)"/>
                            </div>

                            <!-- Preview de la imagen actual -->
                            <div class="text-center mt-2">
                                <img id="modalImagenPreview"
                                     src=""
                                     alt="preview"
                                     class="img-modal-preview"
                                     onerror="this.style.display='none'"/>
                            </div>

                        </div>

                        <!-- Footer con botones -->
                        <div class="modal-footer justify-content-end">
                            <button type="button" class="btn btn-secondary btn-modal-cerrar" data-bs-dismiss="modal">
                                <i class="fas fa-times"></i> [[#{categoria.modal.cerrar}]]
                            </button>
                            <button type="submit" class="btn btn-success btn-modal-guardar">
                                <i class="fas fa-save"></i> [[#{categoria.modal.guardar}]]
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>

        <script>
            function abrirModalActualizar(btn) {
                document.getElementById('modalCatId').value        = btn.dataset.id;
                document.getElementById('modalDescripcion').value  = btn.dataset.descripcion;
                document.getElementById('modalActivo').checked     = btn.dataset.activo === 'true';

                var preview = document.getElementById('modalImagenPreview');
                var src = btn.dataset.imagen;
                if (src) {
                    preview.src = src;
                    preview.style.display = 'block';
                } else {
                    preview.src = '';
                    preview.style.display = 'none';
                }
            }

            function previsualizarImagen(input) {
                var preview = document.getElementById('modalImagenPreview');
                if (input.files && input.files[0]) {
                    var reader = new FileReader();
                    reader.onload = function(e) {
                        preview.src = e.target.result;
                        preview.style.display = 'block';
                    };
                    reader.readAsDataURL(input.files[0]);
                }
            }
        </script>

        <footer th:replace="~{general/fragmentos :: footer}"/>
    </body>
</html>
